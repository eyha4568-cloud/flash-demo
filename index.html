<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E4FD8">
<title>فلاش - خدمات المنزل</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#1E4FD8;--p2:#4F7BFF;--g:#16A34A;--a:#F59E0B;--bg:#F3F6FC;--card:#fff;--tx:#0F172A;--mut:#64748B;--br:#E3E9F4;--red:#DC2626;--sh:0 4px 18px rgba(30,79,216,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0A1020;--card:#121B2F;--tx:#E8EDF7;--mut:#94A3B8;--br:#22304B;--sh:0 4px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.65;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(30,79,216,.3)}
header img{width:30px;height:30px;border-radius:8px}header h1{font-size:18px;margin:0;flex:1;font-weight:800}
main{max-width:760px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--br);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:9px 4px;text-decoration:none;color:var(--mut);font-size:12px;font-weight:600}
nav a b{display:block;font-size:21px}nav a.on{color:var(--p)}
.hero{background:linear-gradient(135deg,#1E4FD8,#4F7BFF 60%,#7BA3FF);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero:after{content:"⚡";position:absolute;left:-10px;bottom:-30px;font-size:150px;opacity:.15}
.hero h2{margin:0 0 6px;font-size:24px;font-weight:800}.hero p{margin:0;opacity:.92}
.trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.trust span{background:rgba(255,255,255,.18);padding:4px 11px;border-radius:20px;font-size:12px}
.banner{background:#FEF3C7;color:#78350F;border-radius:12px;padding:9px 13px;font-size:12.5px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.svc{background:var(--card);border:2px solid var(--br);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.svc .ic{width:46px;height:46px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(30,79,216,.1)}
.svc.on{border-color:var(--p);background:rgba(30,79,216,.07);transform:scale(1.03)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--br);border-radius:12px;font:inherit;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:auto;margin-inline-end:6px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--p);color:#fff;font-weight:700}
button:active{transform:scale(.97)}
button.sec{background:transparent;color:var(--p);border:1.5px solid var(--p)}
button.ok{background:var(--g)}button.no{background:var(--red)}button.em{background:var(--a);color:#1a1200}button.sm{padding:8px 13px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--br);color:var(--tx);font-weight:600}
.chip.g{background:#DCFCE7;color:#166534}.chip.a{background:#FEF3C7;color:#92400E}.chip.b{background:#DBEAFE;color:#1E40AF}.chip.r{background:#FEE2E2;color:#991B1B}
.big{display:grid;gap:12px}
.big a{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--br);border-radius:18px;padding:16px;text-decoration:none;color:var(--tx);box-shadow:var(--sh)}
.big a i{font-style:normal;font-size:30px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(30,79,216,.1)}
.big b{font-size:17px;display:block}.big small{color:var(--mut)}
.steps{display:flex;gap:4px;margin:10px 0 4px}.steps i{flex:1;height:7px;border-radius:4px;background:var(--br)}.steps i.on{background:var(--g)}
.mut{color:var(--mut);font-size:13px}.hr{height:1px;background:var(--br);margin:10px 0}
.stars button{background:none;font-size:30px;padding:2px 3px;color:#CBD5E1}.stars button.on{color:var(--a)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat div{text-align:center;font-size:12px;color:var(--mut)}.stat b{font-size:22px;display:block;color:var(--p)}
.chat{background:var(--bg);border-radius:14px;padding:10px;max-height:240px;overflow:auto;margin:8px 0}
.msg{max-width:80%;padding:7px 12px;border-radius:14px;margin:4px 0;font-size:14px;width:fit-content}
.msg.me{background:var(--p);color:#fff;margin-inline-start:auto;border-end-end-radius:4px}.msg.ot{background:var(--card);border:1px solid var(--br);border-end-start-radius:4px}
.tags button{background:var(--card);color:var(--tx);border:1.5px solid var(--br);font-size:13px;padding:6px 12px;margin:3px}.tags button.on{border-color:var(--g);background:#DCFCE7;color:#166534}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.sum td{padding:5px 0}.sum td:last-child{text-align:left;font-weight:700}
.eta{height:10px;background:var(--br);border-radius:6px;overflow:hidden}.eta i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#4ADE80);transition:width .5s}
</style>
</head>
<body>
<header><img src="icon.svg" alt=""><h1 id="ttl">فلاش</h1></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
"use strict";
const SERVICES={"كهرباء":"⚡","سباكة":"🚰","تكييف":"❄️","نجارة":"🪚","دهانات":"🎨","تشطيب":"🏠","محارة":"🧱","بناء":"🏗️","تركيب سيراميك":"🔲","ألوميتال وزجاج":"🪟","أقفال وأبواب":"🔐","تنظيف":"🧹","نقل وتركيب أثاث":"🛋️","مكافحة حشرات":"🐜","صيانة أجهزة منزلية":"🔧"};
const DEF_PRICE={"كهرباء":[150,600],"سباكة":[150,700],"تكييف":[250,1200],"نجارة":[200,1500],"دهانات":[500,5000],"تشطيب":[1000,15000],"محارة":[600,4000],"بناء":[1500,20000],"تركيب سيراميك":[400,6000],"ألوميتال وزجاج":[300,3500],"أقفال وأبواب":[150,900],"تنظيف":[300,2000],"نقل وتركيب أثاث":[400,3500],"مكافحة حشرات":[300,1500],"صيانة أجهزة منزلية":[150,900]};
const FEE=0.10,MAXC=3,WARRANTY=7,ADMIN_HASH="4b43ed9d53e0d036a6cfcef14603f385b4051e4d8f3507fd590ffe6e65f22c8f";
const STEPS=[["accepted","تم القبول","✅"],["ontheway","الفني في الطريق","🚗"],["arrived","وصل","📍"],["working","جاري الشغل","🛠️"],["done","تم الانتهاء","🎉"]];
const TAGS=["ملتزم بالمواعيد","نضيف","محترف","سعر عادل"];
const QUICK_C=["أنت فين دلوقتي؟","هل معاك الأدوات؟","العمارة فيها مصعد","تمام، مستنيك"],QUICK_T=["أنا في الطريق","وصلت قدام العمارة","محتاج قطع غيار، هبلغك بالسعر","خلصت الشغل"];
function seed(){const n=["أحمد علي","محمود سعيد","محمد حسن","كريم عادل","ياسر فتحي","خالد منصور"],s=Object.keys(SERVICES);
  return{reqs:[],nid:1,tnid:7,mult:1.5,reports:[],prices:JSON.parse(JSON.stringify(DEF_PRICE)),
  techs:n.map((x,i)=>({id:i+1,name:x,phone:"010"+(20000000+i*1234567),yrs:[9,6,4,7,2,11][i],svc:[s[i%15],s[(i*3+1)%15],s[(i*5+2)%15]],rating:[4.9,4.8,4.6,4.7,4.3,4.8][i],jobs:[64,31,12,25,5,48][i],cancel:[0.01,0.02,0.1,0.03,0.08,0.01][i],approved:i<5,online:true,docs:true}))}}
let S;try{S=JSON.parse(localStorage.getItem("flash_demo2")||"null")}catch(e){S=null}
if(!S||!S.techs)S=seed();
const save=()=>{try{localStorage.setItem("flash_demo2",JSON.stringify(S))}catch(e){}};
const $=h=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trusted=t=>t.rating>=4.7&&t.jobs>=20&&t.cancel<0.05&&t.docs;
const money=n=>Math.round(n).toLocaleString("en")+" ج.م";
const app=document.getElementById("app");
let draft={svc:"",urgent:false},techId=+(sessionStorage.getItem("tid")||1),openChat={};
function ls(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){}}
function navbar(h){const items=h.startsWith("#/c")?[["#/c","🏠","طلباتي"],["#/","🔀","التبديل"]]:h.startsWith("#/t")?[["#/t","🛠️","شغلي"],["#/","🔀","التبديل"]]:h.startsWith("#/a")?[["#/a","📊","الإدارة"],["#/","🔀","التبديل"]]:[["#/","🏠","الرئيسية"],["#/c","👤","عميل"],["#/t","🛠️","فني"],["#/a","📊","مدير"]];
  document.getElementById("nav").innerHTML=items.map(i=>`<a href="${i[0]}" class="${h===i[0]||(i[0]==="#/"&&h==="#/")?"on":""}"><b>${i[1]}</b>${i[2]}</a>`).join("")}
function route(){const h=location.hash||"#/";navbar(h);
  document.getElementById("ttl").textContent=h.startsWith("#/c")?"فلاش - العميل":h.startsWith("#/t")?"فلاش للفنيين":h.startsWith("#/a")?"إدارة فلاش":"فلاش";
  (h.startsWith("#/c")?customer:h.startsWith("#/t")?tech:h.startsWith("#/a")?admin:landing)();scrollTo(0,0)}
const banner=()=>'<div class="banner">نسخة تجريبية: كل البيانات محفوظة في متصفحك أنت بس. جرّب الدورة كاملة بنفسك كعميل وفني ومدير.</div>';
function modal(html,mount){const o=$(`<div class="ov"><div class="sheet">${html}</div></div>`);o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);mount&&mount(o);return o}
function landing(){app.innerHTML=`<div class="hero"><h2>فني موثوق لحد باب بيتك</h2><p>اطلب أي خدمة، استلم عروض أسعار من فنيين قريبين، وفاوض بأمان.</p>
 <div class="trust"><span>✔ فنيين موثقين</span><span>💰 أسعار عادلة</span><span>📍 تتبع مباشر</span><span>🛡️ ضمان ${WARRANTY} أيام</span></div></div>${banner()}
 <div class="big"><a href="#/c"><i>🏠</i><div><b>أنا عميل</b><small>اطلب خدمة واستلم العروض وفاوض</small></div></a>
 <a href="#/t"><i>🛠️</i><div><b>أنا فني</b><small>سجّل، شوف الطلبات وابعت عروضك</small></div></a>
 <a href="#/a"><i>📊</i><div><b>المدير</b><small>اعتماد الفنيين، الأسعار، والبلاغات (بكلمة سر)</small></div></a></div>`}
function suggest(svc,urgent){const p=S.prices[svc]||DEF_PRICE[svc],m=urgent?S.mult:1;return[p[0]*m,p[1]*m]}
/* ===== customer ===== */
function customer(){const mine=S.reqs.slice().reverse();
 app.innerHTML=banner()+`<div class="card"><h3>اطلب خدمة</h3><div class="grid">${Object.keys(SERVICES).map(k=>`<div class="svc ${draft.svc===k?"on":""}" data-k="${k}"><div class="ic">${SERVICES[k]}</div>${k}</div>`).join("")}</div>
 <div id="sg"></div>
 <label>وصف المشكلة</label><textarea id="d" rows="3" placeholder="مثلاً: ماسورة المطبخ بتسرّب"></textarea>
 <label>العنوان (اكتبه بحرية)</label><input id="ad" placeholder="مثلاً: 15 شارع النصر، مدينة نصر، القاهرة">
 <label><input type="checkbox" id="em">🚨 طلب طارئ (يتضاعف السعر ×${S.mult} وبيوصل للأقرب فوراً)</label>
 <p><button id="go" style="width:100%">إرسال الطلب</button></p></div>
 <h3>طلباتي</h3>${mine.length?"":'<p class="mut">لسه معندكش طلبات.</p>'}<div id="list"></div>`;
 const sg=()=>{const box=document.getElementById("sg");if(!draft.svc){box.innerHTML="";return}const[a,b]=suggest(draft.svc,document.getElementById("em").checked);
  box.innerHTML=`<div class="card" style="background:rgba(22,163,74,.08);margin:12px 0 0"><b>💡 السعر التقديري: ${money(a)} – ${money(b)}</b><div class="mut">يشمل المعاينة والمصنعية. قطع الغيار على حسابك وبتتوافق عليها قبل الشراء.</div></div>`};
 app.querySelectorAll(".svc").forEach(e=>e.onclick=()=>{draft.svc=e.dataset.k;app.querySelectorAll(".svc").forEach(x=>x.classList.toggle("on",x===e));sg()});
 document.getElementById("em").onchange=sg;sg();
 document.getElementById("go").onclick=()=>{const d=document.getElementById("d").value.trim(),a=document.getElementById("ad").value.trim();
  if(!draft.svc)return alert("اختار الخدمة الأول");if(d.length<5)return alert("اكتب وصف للمشكلة");if(a.length<5)return alert("اكتب العنوان");
  S.reqs.push({id:S.nid++,svc:draft.svc,desc:d,addr:a,urgent:document.getElementById("em").checked,status:"open",offers:[],tech:null,price:null,eta:0,chat:[],rating:0,tags:[],comment:""});draft.svc="";save();customer()};
 const L=document.getElementById("list");mine.forEach(r=>L.appendChild(custCard(r)))}
const hist=o=>o.hist.map(h=>(h.by==="t"?"الفني":"أنت")+" "+money(h.p)).join(" ← ");
function chatBox(r,me,quick){const wrap=$(`<div><div class="chat">${r.chat.length?r.chat.map(m=>`<div class="msg ${m.by===me?"me":"ot"}">${esc(m.t)}</div>`).join(""):'<div class="mut">ابدأ المحادثة. أرقام التليفون مخفية، الكلام بيتم من داخل التطبيق.</div>'}</div>
 <div class="row">${quick.map(q=>`<button class="sec sm" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
 <div class="row" style="margin-top:6px"><input class="sp" placeholder="اكتب رسالة" id="m${r.id}${me}"><button class="sm" data-send>إرسال</button></div></div>`);
 const send=t=>{if(!t.trim())return;r.chat.push({by:me,t:t.trim()});save();route()};
 wrap.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));wrap.querySelector("[data-send]").onclick=()=>send(wrap.querySelector("input").value);
 const c=wrap.querySelector(".chat");setTimeout(()=>c.scrollTop=c.scrollHeight);return wrap}
function custCard(r){const el=$("<div class='card'></div>"),stIdx=STEPS.findIndex(s=>s[0]===r.status);
 const stTxt=r.status==="open"?"بانتظار العروض":r.status==="cancelled"?"ملغي":STEPS[stIdx][1];
 let h=`<div class="row"><b>${SERVICES[r.svc]} ${esc(r.svc)}</b>${r.urgent?'<span class="chip a">🚨 طارئ</span>':""}<span class="sp"></span><span class="chip ${r.status==="done"?"g":r.status==="cancelled"?"r":"b"}">${stTxt}</span></div><div class="mut">${esc(r.desc)}<br>📍 ${esc(r.addr)}</div>`;
 if(r.status==="open"){const[a,b]=suggest(r.svc,r.urgent);h+=`<div class="mut">السعر التقديري ${money(a)} – ${money(b)}</div><div class="hr"></div>`+(r.offers.length?"":'<p class="mut">هتظهر العروض هنا لما الفنيين يبعتوها (جرّب من صفحة الفني).</p>');
  const offers=r.offers.slice().sort((x,y)=>x.hist[x.hist.length-1].p-y.hist[y.hist.length-1].p);
  offers.forEach(o=>{const t=S.techs.find(x=>x.id===o.tech),last=o.hist[o.hist.length-1],my=last.by==="t"&&o.st==="pending";
   h+=`<div class="card" style="margin:8px 0;box-shadow:none"><div class="row"><b>${esc(t.name)}</b>${trusted(t)?'<span class="chip g">✔ فني موثوق</span>':""}<span class="chip">⭐ ${t.rating}</span><span class="chip">${t.jobs} شغلانة</span><span class="chip">${t.yrs} سنين خبرة</span></div>
   <div class="mut">🕒 يوصلك خلال ${o.eta} دقيقة${o.msg?" • «"+esc(o.msg)+"»":""}</div><div>العرض: <b>${money(last.p)}</b></div><div class="mut">${hist(o)}</div>
   ${o.st==="rejected"?'<span class="chip r">مرفوض</span>':my?`<div class="row" style="margin-top:8px"><button class="ok sm" data-a="acc" data-o="${o.id}">قبول</button>${o.hist.length<MAXC+1?`<button class="sec sm" data-a="ctr" data-o="${o.id}">تفاوض (${MAXC-(o.hist.length-1)} متبقي)</button>`:'<span class="mut">انتهت جولات التفاوض</span>'}<button class="no sm" data-a="rej" data-o="${o.id}">رفض</button></div>`:'<span class="chip a">بانتظار رد الفني</span>'}</div>`});
  h+=`<button class="sec sm" data-cancel="1">إلغاء الطلب (مجاناً)</button>`;
 }else if(r.status==="cancelled"){h+=""}
 else{const t=S.techs.find(x=>x.id===r.tech),fee=r.price*FEE,pct=Math.round(stIdx/(STEPS.length-1)*100);
  h+=`<div class="hr"></div><div class="row"><b>${esc(t.name)}</b>${trusted(t)?'<span class="chip g">✔ فني موثوق</span>':""}<span class="chip">⭐ ${t.rating}</span></div>
  <div class="steps">${STEPS.map((s,k)=>`<i class="${k<=stIdx?"on":""}"></i>`).join("")}</div><div><b>${STEPS[stIdx][2]} ${STEPS[stIdx][1]}</b></div>
  ${r.status==="ontheway"?`<div class="mut">الوصول المتوقع خلال ${r.eta} دقيقة</div><div class="eta"><i style="width:${40}%"></i></div>`:""}
  <div class="mut">الإجمالي ${money(r.price+fee)} (الخدمة ${money(r.price)} + رسوم المنصة ${money(fee)}) • ضمان ${WARRANTY} أيام</div>`;
  if(r.status!=="done")h+=`<div class="row" style="margin-top:8px"><button class="sm" data-chat="1">💬 محادثة</button><button class="sec sm" data-share="1">📤 مشاركة مع شخص موثوق</button><button class="em sm" data-sos="1">🆘 بلاغ / طوارئ</button>
   ${["accepted"].includes(r.status)?'<button class="sec sm" data-cancel="1">إلغاء مجاني</button>':'<button class="sec sm" data-cancel="2">إلغاء (برسوم)</button>'}</div><div id="cb"></div>`;
  if(r.status==="done"&&!r.rating)h+=`<div class="hr"></div><b>قيّم الفني</b><div class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${n}">★</button>`).join("")}</div><div class="tags">${TAGS.map(t=>`<button data-tag="${t}">${t}</button>`).join("")}</div><textarea id="cm" rows="2" placeholder="تعليق (اختياري)"></textarea><button class="ok sm" style="margin-top:6px" data-rate>إرسال التقييم</button>`;
  if(r.rating)h+=`<div class="hr"></div><div>تقييمك: <span style="color:var(--a)">${"★".repeat(r.rating)}</span> ${r.tags.map(x=>`<span class="chip g">${x}</span>`).join(" ")}</div>`;
  if(r.status==="done"&&r.rating)h+=`<button class="sec sm" style="margin-top:8px" data-again>🔁 احجز نفس الفني تاني</button>`}
 el.innerHTML=h;
 el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const o=r.offers.find(x=>x.id==b.dataset.o),last=o.hist[o.hist.length-1],t=S.techs.find(x=>x.id===o.tech);
  if(b.dataset.a==="rej"){o.st="rejected";save();return route()}

  S.techs.push({id:S.tnid++,name:n,phone:"",yrs:y||0,svc:picked.slice(),rating:0,jobs:0,cancel:0,approved:false,online:true,docs:true});techId=S.tnid-1;ls("tid",techId);save();tech();alert("اتسجلت! افتح صفحة المدير واعتمد الحساب.")};

   if(o.st==="rejected")h+='<span class="chip r">العميل رفض</span>';else if(my)h+=`<div>العميل اقترح <b>${money(last.p)}</b></div><div class="row" style="margin-top:6px"><button class="ok sm" data-t="acc">قبول</button>${o.hist.length<MAXC+1?'<button class="sec sm" data-t="ctr">سعر مضاد</button>':'<span class="mut">انتهت الجولات</span>'}<button class="no sm" data-t="rej">رفض</button></div>`;else h+='<span class="chip a">بانتظار رد العميل</span>'}
  el.innerHTML=h;B.appendChild(el);
  const sb=el.querySelector("[data-s]");if(sb)sb.onclick=()=>{const v=+el.querySelector("#p"+r.id).value,e=+el.querySelector("#e"+r.id).value;if(!v||v<=0||!e||e<=0)return alert("اكتب السعر ووقت الوصول");r.offers.push({id:r.id*100+me.id,tech:me.id,st:"pending",eta:e,msg:el.querySelector("#g"+r.id).value,hist:[{by:"t",p:v}]});save();tech()};

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function admin(){if(ls("adm")!=="1"){app.innerHTML=banner()+`<div class="card"><h3>🔐 دخول المدير</h3><input type="password" id="pw" placeholder="كلمة السر"><p><button id="lg" style="width:100%">دخول</button></p><div class="mut" id="er"></div></div>`;
  const go=async()=>{try{if(await sha(document.getElementById("pw").value)===ADMIN_HASH){ls("adm","1");admin()}else document.getElementById("er").textContent="كلمة السر غلط."}catch(e){document.getElementById("er").textContent="افتح الموقع من رابط https."}};
  document.getElementById("lg").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};return}
